name: Docker Image CI

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. 코드 가져오기
      - uses: actions/checkout@v4

      # 2. GHCR 로그인
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 3. 이미지 빌드
      - name: Build Docker image
        run: |
          docker build -t ghcr.io/orheunil-dev/allta-partners:latest .

      # 4. GHCR에 push
      - name: Push Docker image
        run: |
          docker push ghcr.io/orheunil-dev/allta-partners:latest

      # 5. VM 배포
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/shoh/allta-partners
            docker compose pull
            docker compose up -d
            docker image prune -f
